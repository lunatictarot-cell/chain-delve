<body><canvas id="canvas" tabindex="0"></canvas><div id="entrance" role="region" aria-label="Dungeon entrance"></div><noscript>게임을 시작하려면 JavaScript를 켜 주세요.</noscript>

<script>
const GODOT_CONFIG={"args": [], "canvasResizePolicy": 0, "ensureCrossOriginIsolationHeaders": false, "executable": "index", "mainPack": "game-v89.pck", "focusCanvas": false, "persistentPaths": ["/userfs"], "fileSizes": {"index.wasm": 39513091, "game-v89.pck": 39200008}};
(async()=>{
  try {
    if(!window.Engine || Engine.getMissingFeatures({threads:false}).length)throw new Error('Unsupported runtime');
    performance.mark('engine-start');
    const engine=new Engine(GODOT_CONFIG);
    await engine.startGame({onProgress:(current,total)=>window.ChainDelveEntrance.progress(current,total)});
    performance.mark('engine-loaded');
    window.ChainDelveAudio.ready();window.ChainDelveEntrance.loaded();
  }catch(error){console.error(error);window.ChainDelveEntrance.fail();}
})();
</script></body></html>
